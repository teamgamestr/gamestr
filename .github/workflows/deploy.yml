name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-gamestr
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gamestr]
    timeout-minutes: 10
    steps:
      - name: Run deploy script
        run: /home/ubuntu/gamestr/deploy gamestr
